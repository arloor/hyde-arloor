{{ define "header" }}
    {{ partial "header.html" . }}
{{ end }}

{{ define "content" }}
<article class="post-article">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="post">
    {{ .Content }}
  </div>
</article>
{{ end }}

{{ define "footer" }}
    {{ partial "footer/font-awesome-js.html" . }}
    {{ partial "highlight-js.html" . }}
    {{ partial "code-copy-button.html" . }}
{{ end }}
