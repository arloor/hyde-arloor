<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
{{ block "header" . }}{{ end }}

<body class="{{ .Site.Params.themeColor }} {{ if .Site.Params.layoutReverse }}layout-reverse{{ end }} {{ if eq .Type "iframe" }}type-iframe{{ end }}">
  {{ partial "sidebar.html" . }}
  <main class="content container">
    {{ block "content" . }}{{ end }}
  </main>
  {{ if ne .Type "iframe" }}
  <footer class="site-footer">
    <div class="site-footer__inner">
      {{ partial "sidebar/copyright.html" . }}
    </div>
  </footer>
  <button type="button" id="back-to-top" class="back-to-top" aria-label="回到顶部" title="回到顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 15l-6-6-6 6"></path>
    </svg>
  </button>
  {{ end }}
  {{ block "footer" . }}{{ end }}
  {{ partial "footer/ui-scripts.html" . }}
</body>

</html>
