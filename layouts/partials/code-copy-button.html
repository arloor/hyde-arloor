<script type="text/javascript">
  document.addEventListener('DOMContentLoaded', function () {
    var copyIcon = '<svg aria-hidden="true" viewBox="0 0 16 16"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path></svg>';
    var checkIcon = '<svg aria-hidden="true" viewBox="0 0 16 16"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path></svg>';

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          resolve();
        } catch (err) {
          reject(err);
        }
      });
    }

    document.querySelectorAll('pre code').forEach(function (codeBlock) {
      var pre = codeBlock.parentNode;
      if (!pre || !pre.parentNode || pre.parentNode.classList.contains('code-block-wrapper')) {
        return;
      }

      var wrapper = document.createElement('div');
      wrapper.className = 'code-block-wrapper';
      pre.parentNode.insertBefore(wrapper, pre);

      // IDE-style header bar (macOS dots + language + copy button)
      var header = document.createElement('div');
      header.className = 'code-block-header';

      var headerLeft = document.createElement('div');
      headerLeft.className = 'code-block-header__left';

      var dots = document.createElement('span');
      dots.className = 'code-block-dots';
      dots.setAttribute('aria-hidden', 'true');
      dots.innerHTML = '<span class="dot-red"></span><span class="dot-yellow"></span><span class="dot-green"></span>';
      headerLeft.appendChild(dots);

      var langMatch = (codeBlock.className || '').match(/(?:language-|lang-)([a-zA-Z0-9_+#.-]+)/);
      var langName = (langMatch && langMatch[1] && langMatch[1] !== 'undefined' && langMatch[1] !== 'plaintext')
        ? langMatch[1]
        : (codeBlock.getAttribute('data-lang') || 'code');

      var langBadge = document.createElement('span');
      langBadge.className = 'code-lang-badge';
      langBadge.textContent = langName;
      headerLeft.appendChild(langBadge);

      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'copy-code-button';
      button.innerHTML = copyIcon + '<span>复制</span>';
      button.setAttribute('aria-label', '复制代码');
      button.setAttribute('title', '复制代码');

      button.addEventListener('click', function () {
        var code = codeBlock.textContent;
        copyText(code).then(function () {
          button.innerHTML = checkIcon + '<span>已复制</span>';
          button.classList.add('copied');
          button.setAttribute('aria-label', '已复制');
          button.setAttribute('title', '已复制');
          setTimeout(function () {
            button.innerHTML = copyIcon + '<span>复制</span>';
            button.classList.remove('copied');
            button.setAttribute('aria-label', '复制代码');
            button.setAttribute('title', '复制代码');
          }, 1800);
        }).catch(function (err) {
          console.error('复制失败:', err);
        });
      });

      header.appendChild(headerLeft);
      header.appendChild(button);
      wrapper.appendChild(header);
      wrapper.appendChild(pre);
    });
  });
</script>
