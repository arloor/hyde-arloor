<script>
(function () {
  // 1. Theme Toggle (Light / Dark, synced with system preference when unset)
  var themeBtn = document.getElementById('theme-toggle');
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      var current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try {
        localStorage.setItem('theme', next);
      } catch (e) {}
    });
  }

  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSystemChange = function (e) {
      try {
        if (!localStorage.getItem('theme')) {
          document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        }
      } catch (err) {}
    };
    if (mq.addEventListener) {
      mq.addEventListener('change', onSystemChange);
    }
  }

  // 2. Mobile Navigation Drawer
  var menuBtn = document.getElementById('mobile-menu-btn');
  var drawer = document.getElementById('mobile-nav-drawer');
  if (menuBtn && drawer) {
    var setMenuOpen = function (open) {
      drawer.classList.toggle('is-open', open);
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      menuBtn.setAttribute('aria-label', open ? '关闭导航菜单' : '打开导航菜单');
    };

    menuBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      setMenuOpen(!drawer.classList.contains('is-open'));
    });

    document.addEventListener('click', function (e) {
      if (drawer.classList.contains('is-open') && !drawer.contains(e.target) && !menuBtn.contains(e.target)) {
        setMenuOpen(false);
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && drawer.classList.contains('is-open')) {
        setMenuOpen(false);
        menuBtn.focus();
      }
    });
  }

  // 3. Back to Top Button
  var backToTop = document.getElementById('back-to-top');
  if (backToTop) {
    var toggleBackToTop = function () {
      backToTop.classList.toggle('is-visible', window.scrollY > 360);
    };
    window.addEventListener('scroll', toggleBackToTop, { passive: true });
    toggleBackToTop();
    backToTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // 4. Article Reading Progress Bar
  var progressBar = document.getElementById('reading-progress-bar');
  if (progressBar) {
    var progressTicking = false;
    var updateProgress = function () {
      progressTicking = false;
      var scrollTop = window.scrollY || document.documentElement.scrollTop;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var pct = docHeight > 0 ? Math.min(100, Math.max(0, (scrollTop / docHeight) * 100)) : 0;
      progressBar.style.width = pct.toFixed(2) + '%';
    };
    var onProgressScroll = function () {
      if (!progressTicking) {
        progressTicking = true;
        window.requestAnimationFrame(updateProgress);
      }
    };
    window.addEventListener('scroll', onProgressScroll, { passive: true });
    window.addEventListener('resize', onProgressScroll, { passive: true });
    updateProgress();
  }

  // 5. Desktop TOC Scroll-Spy
  var tocDesktop = document.querySelector('.toc-desktop');
  if (tocDesktop) {
    var tocLinks = Array.prototype.slice.call(tocDesktop.querySelectorAll('a[href^="#"]'));
    var items = [];
    tocLinks.forEach(function (link) {
      var raw = link.getAttribute('href').slice(1);
      var target = document.getElementById(raw);
      if (!target) {
        try {
          target = document.getElementById(decodeURIComponent(raw));
        } catch (e) {}
      }
      if (target) {
        items.push({ link: link, heading: target });
      }
    });

    if (items.length > 0) {
      var activeLink = null;
      var ticking = false;

      var setActive = function (link) {
        if (activeLink === link) return;
        if (activeLink) activeLink.classList.remove('is-active');
        activeLink = link;
        if (activeLink) {
          activeLink.classList.add('is-active');
          var tocRect = tocDesktop.getBoundingClientRect();
          var linkRect = activeLink.getBoundingClientRect();
          if (linkRect.top < tocRect.top + 24 || linkRect.bottom > tocRect.bottom - 24) {
            activeLink.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        }
      };

      var updateActiveHeading = function () {
        ticking = false;
        var offset = 115;
        var current = items[0].link;

        if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 24) {
          current = items[items.length - 1].link;
        } else {
          for (var i = 0; i < items.length; i++) {
            if (items[i].heading.getBoundingClientRect().top <= offset) {
              current = items[i].link;
            } else {
              break;
            }
          }
        }
        setActive(current);
      };

      var onScroll = function () {
        if (!ticking) {
          ticking = true;
          window.requestAnimationFrame(updateActiveHeading);
        }
      };

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });
      updateActiveHeading();
    }
  }
})();
</script>
