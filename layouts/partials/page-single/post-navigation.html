{{ $enabledPostNavigation := .Site.Params.postNavigation | default true }}
{{ if and $enabledPostNavigation (or .PrevInSection .NextInSection) }}
<nav class="navigation navigation-single" aria-label="文章导航">
  {{ with .PrevInSection }}
  <a href="{{ .RelPermalink }}" class="navigation-prev">
    <span class="navigation-label">&larr; 上一篇</span>
    <span class="navigation-tittle">{{ .Title }}</span>
  </a>
  {{ end }}
  {{ with .NextInSection }}
  <a href="{{ .RelPermalink }}" class="navigation-next">
    <span class="navigation-label">下一篇 &rarr;</span>
    <span class="navigation-tittle">{{ .Title }}</span>
  </a>
  {{ end }}
</nav>
{{ end }}
